<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grounded</title>
<style>
:root {
  --paper: #f3f0e8;
  --ink: #1a1814;
  --muted: #5e584e;
  --rule: #d3cdc2;
  --accent: #1d3c34;
  --negative: #7a2e2e;
  --theater: #241f1a;
  --title: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  --ui: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; height: 100%; }
html, body {
  margin: 0;
  background: var(--theater);
  color: var(--paper);
  font-family: var(--ui);
}
body { overflow: hidden; height: 100%; }
button, input { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; }
button { cursor: pointer; }
::selection { background: var(--accent); color: var(--paper); }
.shell {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  grid-template-rows: 64px minmax(0, 1fr) auto auto;
}
header {
  grid-column: 1 / -1;
  grid-row: 1;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  align-items: center;
  border-bottom: 1px solid var(--rule);
}
.mark {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 22px;
  border-right: 1px solid var(--rule);
  font-family: var(--title);
  font-size: 26px;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.mark span {
  margin-left: 12px;
  font-family: var(--ui);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.tools {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px 22px;
  padding: 0 28px;
}
.tools button, .quiet {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--paper);
  border-bottom: 1px solid transparent;
  padding: 4px 0;
}
.tools button[aria-pressed="true"] { border-bottom-color: var(--paper); }
aside {
  grid-column: 1;
  grid-row: 2 / 5;
  min-height: 0;
  overflow: auto;
  border-right: 1px solid var(--rule);
}
.kicker {
  margin: 0;
  padding: 22px 22px 8px;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.empty {
  margin: 0;
  padding: 12px 22px 22px;
  font-family: var(--title);
  font-size: 22px;
  line-height: 1.35;
}
.item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 16px 22px 18px;
  border-left: 2px solid transparent;
  color: var(--paper);
}
.item.on {
  background: var(--paper);
  color: var(--ink);
  border-left-color: var(--accent);
}
.item .name {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-family: var(--title);
  font-size: 20px;
  line-height: 1.25;
}
.item .meta {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.item.on .meta { color: var(--muted); }
.item:hover .name { text-decoration: underline; text-underline-offset: 0.18em; }
.item.on:hover .name { text-decoration: none; }
.item:focus-visible { outline: 1px solid var(--paper); outline-offset: -1px; }
.item.on:focus-visible { outline-color: var(--accent); }
#stage {
  grid-column: 2;
  grid-row: 2;
  min-width: 0;
  min-height: 0;
  position: relative;
}
#stage.sheet {
  display: flex;
  align-items: center;
  justify-content: center;
  container-type: size;
  container-name: stage;
}
#stage.film, #stage.deck { display: block; }
#stage.film video, #stage.deck iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: var(--theater);
}
body.dropping #stage { outline: 1px solid var(--paper); outline-offset: -16px; }
#caption {
  position: absolute;
  left: 32px;
  right: 32px;
  bottom: 22px;
  margin: 0;
  padding: 14px 18px;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--title);
  font-size: 22px;
  line-height: 1.35;
  pointer-events: none;
}
.frame {
  width: min(1040px, calc(100% - 48px));
  aspect-ratio: 16 / 9;
  max-height: 100%;
  background: var(--paper);
  color: var(--ink);
  color-scheme: light;
  padding: 44px 52px 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@supports (width: 1cqw) {
  .frame {
    width: min(1040px, calc(100cqw - 40px), calc((100cqh - 16px) * 16 / 9));
    max-height: calc(100cqh - 8px);
  }
}
@container stage (max-height: 460px) {
  .frame { padding: 24px 28px 14px; }
  .frame.cover h1 { font-size: 36px; }
  .frame h1 { font-size: 24px; }
  .frame .lead { margin-top: 12px; font-size: 18px; }
  .frame .num.lg { font-size: 32px; }
  .frame .num.xl { font-size: 44px; }
  .frame .figures { margin-top: 16px; }
}
.frame .eyebrow {
  margin: 0 0 14px;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}
.frame .eyebrow.risk { color: var(--negative); }
.frame h1 {
  margin: 0;
  max-width: 18em;
  font-family: var(--title);
  font-weight: 400;
  font-size: 34px;
  line-height: 1.2;
  letter-spacing: -0.015em;
}
.frame.cover h1 { font-size: 52px; line-height: 1.05; max-width: 14em; }
.frame .lead {
  margin: 18px 0 0;
  max-width: 28em;
  font-family: var(--title);
  font-size: 22px;
  line-height: 1.35;
}
.frame .lead.bad { color: var(--negative); }
.frame pre.trace {
  margin: 18px 0 0;
  overflow: auto;
  white-space: pre-wrap;
  font-family: var(--ui);
  font-size: 13px;
  line-height: 1.45;
  color: var(--negative);
}
.skills { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 28px; }
.skills button {
  padding: 6px 0;
  border-bottom: 1px solid transparent;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.skills button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.frame .hint { margin: auto 0 0; color: var(--muted); font-size: 15px; }
.frame .hint button { color: var(--ink); border-bottom: 1px solid var(--rule); padding: 0; }
.frame .figures {
  margin-top: 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px 36px;
}
.frame .label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.frame .num {
  font-family: var(--title);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.frame .num.xl { font-size: 72px; }
.frame .num.lg { font-size: 48px; }
.frame .delta { margin: 16px 0 0; font-size: 18px; color: var(--accent); }
.frame .delta.down { color: var(--negative); }
.frame table { width: 100%; margin-top: 18px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.frame th {
  padding: 0 10px 8px;
  border-bottom: 1px solid var(--ink);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
}
.frame td { padding: 8px 10px; border-bottom: 1px solid var(--rule); font-size: 16px; }
.frame td.num, .frame th.num { text-align: right; font-family: var(--title); }
.frame td.down { color: var(--negative); }
.frame .footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
#scrub { grid-column: 2; grid-row: 3; min-width: 0; }
#track {
  position: relative;
  height: 18px;
  margin: 0 18px;
  cursor: pointer;
}
#track::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 8px;
  height: 2px;
  background: var(--rule);
}
#fill {
  position: absolute;
  left: 0;
  top: 8px;
  height: 2px;
  width: 0;
  background: var(--paper);
}
.scrub-row { display: flex; align-items: stretch; min-width: 0; }
.transport {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 0 0 auto;
  padding: 0 16px;
  border-top: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
}
#play {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--paper);
  padding: 0 0 2px;
}
#time { font-variant-numeric: tabular-nums; font-size: 13px; }
#chapters { display: flex; flex: 1 1 auto; min-width: 0; overflow-x: auto; border-top: 1px solid var(--rule); }
#chapters, aside { scrollbar-color: var(--rule) var(--theater); }
#chapters::-webkit-scrollbar, aside::-webkit-scrollbar { height: 8px; width: 8px; }
#chapters::-webkit-scrollbar-thumb, aside::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 0; }
#chapters::-webkit-scrollbar-track, aside::-webkit-scrollbar-track { background: var(--theater); }
.chapter {
  flex: 0 0 auto;
  max-width: 240px;
  padding: 14px 16px;
  border-bottom: 2px solid transparent;
  color: var(--paper);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chapter .n {
  display: inline-block;
  margin-right: 10px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  color: var(--rule);
}
.chapter.on { border-bottom-color: var(--paper); }
.chapter.on .n { color: var(--paper); }
.chapter:focus-visible { outline: 1px solid var(--paper); outline-offset: -2px; }
#ask {
  grid-column: 2;
  grid-row: 4;
  background: var(--paper);
  color: var(--ink);
  color-scheme: light;
  padding: 12px 28px 16px;
  border-top: 1px solid var(--rule);
}
#ask label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}
#ask input {
  width: 100%;
  border-bottom: 1px solid var(--rule);
  padding: 4px 0 8px;
  outline: none;
  font-family: var(--title);
  font-size: 22px;
  line-height: 1.3;
  color: var(--ink);
}
#ask input:focus { border-bottom-color: var(--accent); }
#ask input::placeholder { color: var(--muted); }
#answer {
  margin: 12px 0 0;
  max-width: 42em;
  max-height: 22vh;
  overflow: auto;
  font-family: var(--title);
  font-size: 22px;
  line-height: 1.35;
}
#answer:empty { display: none; }
#answer.refused { color: var(--muted); }
#answer.bad { color: var(--negative); }
#cite {
  margin: 8px 0 0;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
#cite:empty { display: none; }
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}
@media (max-width: 800px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(220px, 1fr) auto auto;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-right: 12px; }
  .mark { border-right: 0; padding: 12px 14px; font-size: 22px; }
  .tools { flex-wrap: nowrap; padding: 0; gap: 12px; }
  .tools button, .quiet { font-size: 11px; letter-spacing: 0.12em; }
  aside {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    border-right: 0;
    border-bottom: 1px solid var(--rule);
  }
  #stage { grid-column: 1; grid-row: 3; }
  #stage.sheet {
    container-type: normal;
    display: block;
    overflow: auto;
    padding: 14px 0 18px;
  }
  .frame {
    width: calc(100% - 20px);
    height: auto;
    max-height: none;
    aspect-ratio: auto;
    margin: 0 auto;
    overflow: visible;
  }
  #scrub { grid-column: 1; grid-row: 4; }
  #ask { grid-column: 1; grid-row: 5; padding: 12px 14px 14px; }
  .kicker { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  .item { flex: 0 0 auto; width: 200px; border-left: 0; border-bottom: 2px solid transparent; }
  .item.on { border-bottom-color: var(--accent); }
  .frame { width: calc(100% - 20px); padding: 22px 16px 12px; }
  .frame.cover h1 { font-size: 34px; }
  .frame h1 { font-size: 26px; }
  .frame .num.lg { font-size: 32px; }
  .frame .num.xl { font-size: 48px; }
  #caption { left: 12px; right: 12px; bottom: 12px; font-size: 16px; }
  #ask input, #answer { font-size: 18px; }
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="mark">Grounded <span>Studio</span></div>
    <div class="tools" id="tools"></div>
  </header>
  <aside id="rail" aria-label="Briefings">
    <p class="kicker">In the room</p>
  </aside>
  <main id="stage"></main>
  <section id="scrub" hidden></section>
  <form id="ask" hidden>
    <label for="q">Ask</label>
    <input id="q" name="q" autocomplete="off" placeholder="What does this briefing say?">
    <p id="answer"></p>
    <p id="cite"></p>
  </form>
</div>
<p id="live" class="sr" aria-live="polite"></p>
<input id="file" type="file" hidden>
<script>
const CHOICES = [
  ["product-walkthrough", "Walkthrough"],
  ["continuous-take-demo", "Continuous"],
  ["weekly-ops-review", "Weekly"],
  ["wbr-executive", "WBR"],
  ["still-sequence-slideshow", "Slideshow"],
  ["leadership-brief", "Brief"],
  ["launch-announcement", "Launch"],
];
const SKILL_WORD = {
  "product-walkthrough": "Walkthrough",
  "continuous-take-demo": "Continuous",
  "still-sequence-slideshow": "Slideshow",
  "wbr-executive": "WBR",
  "wbr-kpi-spine": "WBR",
  "sop-training": "Procedure",
  "feature-delta": "What changed",
  "weekly-ops-review": "Weekly",
  "leadership-brief": "Brief",
  "launch-announcement": "Launch",
  localize: "Briefing",
};
const SKILL_EYEBROW = {
  "weekly-ops-review": "Weekly operating review",
  "leadership-brief": "Leadership brief",
  "launch-announcement": "Launch",
  "sop-training": "Procedure",
  "product-walkthrough": "Walkthrough",
  "feature-delta": "What changed",
  localize: "Briefing",
};
const LAYOUTS = new Set(["cover", "big-number", "versus-target", "movers", "risk", "ask", "statement", "step"]);
const DECK_FIT = "html,body{height:100%;margin:0;overflow:hidden}.deck{height:100% !important;overflow-y:auto !important;scrollbar-width:none}.deck::-webkit-scrollbar{display:none}.slide{height:100% !important;overflow:hidden !important;container-type:size !important;box-sizing:border-box !important;display:flex !important;align-items:center !important;justify-content:center !important}.frame{width:min(1180px,calc(100cqw - 28px),calc((100cqh - 8px) * 16 / 9)) !important;height:auto !important;aspect-ratio:16/9 !important}@container (max-width: 520px){.frame{width:calc(100cqw - 20px) !important;max-height:calc(100cqh - 12px) !important;aspect-ratio:auto !important;padding:16px 14px 10px !important}.cover h1{font-size:32px !important;line-height:1.05 !important}h1{font-size:22px !important;line-height:1.2 !important}}";

const room = {
  briefings: [],
  current: null,
  openingId: "",
  mode: "intake",
  beat: 0,
  skill: "product-walkthrough",
  busy: false,
  ticket: 0,
  edl: null,
  indexError: false,
};

function boot() {
  document.getElementById("tools").addEventListener("click", onTool);
  document.getElementById("ask").addEventListener("submit", onAsk);
  document.addEventListener("keydown", onKey);
  window.addEventListener("hashchange", syncRoute);
  window.addEventListener("dragover", (event) => {
    event.preventDefault();
    document.body.classList.add("dropping");
  });
  window.addEventListener("dragleave", (event) => {
    if (!event.relatedTarget) document.body.classList.remove("dropping");
  });
  window.addEventListener("drop", (event) => {
    event.preventDefault();
    document.body.classList.remove("dropping");
    const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
    if (file) begin(file);
  });
  document.getElementById("file").addEventListener("change", (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (file) begin(file);
  });
  loadIndex();
  syncRoute();
}

function syncRoute() {
  if (room.busy) return;
  const id = idFromHash();
  if (!id) {
    room.current = null;
    room.openingId = "";
    showIntake();
    return;
  }
  if (room.current && String(room.current.briefing.id) === id) return;
  openBriefing(id);
}

function idFromHash() {
  const match = location.hash.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  return match ? match[0] : "";
}

async function loadIndex() {
  try {
    const data = await getJson("/api/v1/briefings");
    room.briefings = data.briefings || [];
    room.indexError = false;
  } catch (err) {
    room.briefings = [];
    room.indexError = true;
  }
  renderRail();
}

function renderRail() {
  const rail = document.getElementById("rail");
  const active = (room.current && String(room.current.briefing.id)) || String(room.openingId || "");
  if (!room.briefings.length) {
    const line = room.indexError ? "The room could not open." : "Nothing in the room yet.";
    rail.innerHTML = `<p class="kicker">In the room</p><p class="empty">${line}</p>`;
    return;
  }
  const items = room.briefings.map((row) => {
    const on = String(row.id) === active;
    const when = row.created_at ? stamp(row.created_at) : "";
    const meta = when ? skillWord(row.skill_id) + " · " + when : skillWord(row.skill_id);
    return `<button type="button" class="item${on ? " on" : ""}" data-id="${esc(row.id)}" aria-current="${on ? "true" : "false"}"><span class="name">${esc(row.title || "Untitled briefing")}</span><span class="meta">${esc(meta)}</span></button>`;
  }).join("");
  rail.innerHTML = `<p class="kicker">In the room</p>${items}`;
  rail.querySelectorAll(".item").forEach((node) => {
    node.addEventListener("click", () => {
      location.hash = "#/" + node.dataset.id;
    });
  });
}

function renderTools() {
  const tools = document.getElementById("tools");
  const script = room.current && room.current.script;
  const artifacts = (room.current && room.current.artifacts) || [];
  const hasFilm = artifacts.some((item) => item.kind === "video");
  const hasDeck = artifacts.some((item) => item.kind === "deck");
  const parts = [];
  if (hasFilm && hasDeck) {
    parts.push(modeButton("film", "Film"));
    parts.push(modeButton("deck", "Deck"));
  }
  if (script && !hasFilm && !hasDeck) parts.push(`<button type="button" id="project">Project</button>`);
  if (script && !script.accepted) parts.push(`<button type="button" id="accept">Accept</button>`);
  else   if (script && script.accepted) parts.push(`<span class="quiet">Accepted</span>`);
  if (room.current) parts.push(`<button type="button" id="link">Link</button>`);
  parts.push(`<button type="button" id="new">New</button>`);
  tools.innerHTML = parts.join("");
}

function modeButton(mode, label) {
  const on = room.mode === mode;
  return `<button type="button" data-mode="${mode}" aria-pressed="${on ? "true" : "false"}">${label}</button>`;
}

function onTool(event) {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.id === "new") goNew();
  else if (button.id === "link") copyLink();
  else if (button.id === "accept") accept().catch((err) => showFailure(currentTitle(), err.message));
  else if (button.id === "project") project();
  else if (button.dataset.mode) setMode(button.dataset.mode);
}

function copyLink() {
  const url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => say("Link copied."));
    return;
  }
  say("Link is in the address bar.");
}

function goNew() {
  if (room.busy) return;
  const video = document.getElementById("film");
  if (video) video.pause();
  if (location.hash) location.hash = "";
  else syncRoute();
}

function setMode(mode) {
  if (!room.current || room.mode === mode) return;
  const video = document.getElementById("film");
  if (video) video.pause();
  room.mode = mode;
  room.beat = 0;
  paintStage();
  renderTools();
}

async function openBriefing(id) {
  const mine = ++room.ticket;
  room.openingId = id;
  renderRail();
  try {
    const briefing = await getJson("/api/v1/briefings/" + id);
    if (mine !== room.ticket) return;
    let scriptRow = null;
    try {
      scriptRow = await getJson("/api/v1/briefings/" + id + "/script");
    } catch (err) {
      if (err.status !== 404) throw err;
    }
    if (mine !== room.ticket) return;
    const listed = await getJson("/api/v1/briefings/" + id + "/artifacts");
    if (mine !== room.ticket) return;
    const script = unwrap(scriptRow);
    room.current = { briefing, script, artifacts: listed.artifacts || [] };
    room.openingId = id;
    room.beat = 0;
    room.edl = null;
    room.mode = chooseMode(script, room.current.artifacts);
    document.title = (briefing.title || "Briefing") + " — Grounded";
    clearAnswer();
    document.getElementById("ask").hidden = !script;
    await paintStage();
    renderRail();
    renderTools();
  } catch (err) {
    if (mine !== room.ticket) return;
    showFailure("Briefing", err.message || "The room could not open this briefing.");
  }
}

function chooseMode(script, artifacts) {
  const video = artifacts.some((item) => item.kind === "video");
  const deck = artifacts.some((item) => item.kind === "deck");
  if (script && script.renderer === "recording" && video) return "film";
  if (deck) return "deck";
  if (video) return "film";
  if (script) return "read";
  return "empty";
}

async function paintStage() {
  const current = room.current;
  if (!current) return;
  const artifacts = current.artifacts || [];
  if (room.mode === "film") {
    const video = artifacts.find((item) => item.kind === "video");
    const vtt = artifacts.find((item) => item.kind === "captions");
    const edlArt = artifacts.find((item) => item.kind === "edl");
    let edl = null;
    if (edlArt) {
      try {
        const response = await fetch(fileUrl(edlArt.id));
        if (response.ok) edl = await response.json();
      } catch (err) {
        edl = null;
      }
    }
    room.edl = edl;
    showFilm(video, vtt);
    return;
  }
  if (room.mode === "deck") {
    showDeck(artifacts.find((item) => item.kind === "deck"), current.briefing);
    return;
  }
  if (room.mode === "read" && current.script) {
    document.getElementById("stage").className = "sheet";
    paintBeat(0);
    renderScrub();
    return;
  }
  showSheet({
    eyebrow: skillWord(current.briefing.skill_id),
    title: current.briefing.title || "Untitled briefing",
    lead: "Nothing to project yet.",
  });
  hideScrub();
}

function showFilm(artifact, vtt) {
  const stage = document.getElementById("stage");
  stage.className = "film";
  stage.innerHTML = "";
  const video = document.createElement("video");
  video.id = "film";
  video.playsInline = true;
  video.preload = "auto";
  video.setAttribute("aria-label", currentTitle());
  if (vtt) {
    const track = document.createElement("track");
    track.kind = "subtitles";
    track.label = "English";
    track.srclang = "en";
    track.src = fileUrl(vtt.id);
    video.appendChild(track);
  }
  video.src = fileUrl(artifact.id);
  const caption = document.createElement("p");
  caption.id = "caption";
  caption.hidden = true;
  stage.append(video, caption);
  video.addEventListener("timeupdate", () => onFilmTime(video));
  video.addEventListener("loadedmetadata", () => onFilmTime(video));
  video.addEventListener("play", () => setPlayLabel(true));
  video.addEventListener("pause", () => setPlayLabel(false));
  video.addEventListener("ended", () => setPlayLabel(false));
  renderScrub();
}

function showDeck(artifact, briefing) {
  const stage = document.getElementById("stage");
  stage.className = "deck";
  stage.innerHTML = "";
  const frame = document.createElement("iframe");
  frame.id = "deck";
  frame.title = briefing.title || "Deck";
  frame.setAttribute("scrolling", "no");
  frame.src = fileUrl(artifact.id);
  stage.appendChild(frame);
  frame.addEventListener("load", () => {
    const win = frame.contentWindow;
    if (!win || !win.document || !win.document.head) return;
    const style = win.document.createElement("style");
    style.textContent = DECK_FIT;
    win.document.head.appendChild(style);
    const scroller = win.document.querySelector(".deck");
    if (scroller) scroller.scrollTop = 0;
    win.document.addEventListener("keydown", () => {
      setTimeout(() => {
        room.beat = deckIndex(win);
        markChapter(room.beat);
      }, 40);
    });
    room.beat = 0;
    markChapter(0);
  });
  renderScrub();
}

function paintBeat(index) {
  const script = room.current && room.current.script;
  const beats = (script && script.beats) || [];
  const beat = beats[index];
  if (!beat) return;
  room.beat = index;
  const layout = LAYOUTS.has(beat.layout) ? beat.layout : "statement";
  const slots = beat.slots || {};
  const risk = layout === "risk" ? " risk" : "";
  let extra = "";
  if (layout === "versus-target") {
    const down = slots.direction === "below" ? " down" : "";
    extra = `<div class="figures"><div><span class="label">Actual</span><div class="num lg">${esc(slots.actual || "")}</div></div><div><span class="label">Target</span><div class="num lg">${esc(slots.target || "")}</div></div></div><p class="delta${down}">${esc(slots.delta || "")}</p>`;
  } else if (layout === "big-number") {
    extra = `<p class="num xl">${esc(slots.actual || "")}</p>`;
  } else if (layout === "movers") {
    const rows = (slots.rows || []).map((row) => {
      const delta = String(row.delta || "");
      const klass = delta.startsWith("-") ? "num down" : "num";
      return `<tr><td>${esc(row.line || "")}</td><td class="num">${esc(row.this_week || "")}</td><td class="num">${esc(row.last_week || "")}</td><td class="${klass}">${esc(delta)}</td></tr>`;
    }).join("");
    extra = `<table><thead><tr><th>Line</th><th class="num">This week</th><th class="num">Last week</th><th class="num">Delta</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else if (layout === "cover" && slots.period) {
    extra = `<p class="lead">${esc(slots.period)}</p>`;
  } else if (layout === "step" && slots.screen) {
    extra = `<p class="lead">${esc(slots.screen)}</p>`;
  }
  const stage = document.getElementById("stage");
  stage.className = "sheet";
  stage.innerHTML = `<article class="frame ${layout}"><p class="eyebrow${risk}">${esc(beatEyebrow(script, beat))}</p><h1>${esc(beat.text || "")}</h1>${extra}<footer class="footer"><span>${esc(citeLabel(beat.citations))}</span><span>${index + 1} / ${beats.length}</span></footer></article>`;
  markChapter(index);
}

function beatEyebrow(script, beat) {
  const slots = beat.slots || {};
  if (beat.layout === "cover") return SKILL_EYEBROW[script.skill_id] || "Briefing";
  if (beat.layout === "step") return "Step " + (beat.ord || "");
  if (slots.eyebrow) return slots.eyebrow;
  const names = { statement: "Statement", ask: "Ask", risk: "Risk", movers: "Movers" };
  return names[beat.layout] || "Briefing";
}

function renderScrub() {
  const scrub = document.getElementById("scrub");
  const beats = currentBeats();
  const film = room.mode === "film";
  if (!film && !beats.length) {
    hideScrub();
    return;
  }
  scrub.hidden = false;
  const chapters = beats.map((beat, index) => {
    const label = film ? (beat.title || beat.text || "Chapter") : short(beat.text || "");
    const on = index === room.beat;
    return `<button type="button" class="chapter${on ? " on" : ""}" data-i="${index}" aria-current="${on ? "true" : "false"}"><span class="n">${String(index + 1).padStart(2, "0")}</span>${esc(label)}</button>`;
  }).join("");
  const transport = film ? `<div class="transport"><button type="button" id="play">Play</button><span id="time">0:00</span></div>` : "";
  const track = film ? `<div id="track" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>` : "";
  scrub.innerHTML = `${track}<div class="scrub-row">${transport}<div id="chapters">${chapters}</div></div>`;
  scrub.querySelectorAll(".chapter").forEach((node) => {
    node.addEventListener("click", () => goBeat(Number(node.dataset.i)));
  });
  const play = document.getElementById("play");
  if (play) play.addEventListener("click", togglePlay);
  const bar = document.getElementById("track");
  if (bar) {
    bar.addEventListener("click", seekTrack);
    bar.addEventListener("keydown", onTrackKey);
  }
}

function goBeat(index) {
  const beats = currentBeats();
  if (!beats.length) return;
  const next = Math.max(0, Math.min(beats.length - 1, index));
  room.beat = next;
  if (room.mode === "film") {
    const video = document.getElementById("film");
    const item = beats[next];
    if (video && item) video.currentTime = Number(item.out_in_ms || 0) / 1000;
    markChapter(next);
  } else if (room.mode === "deck") {
    seekDeck(next);
  } else if (room.mode === "read") {
    paintBeat(next);
  }
}

function seekDeck(index) {
  const frame = document.getElementById("deck");
  if (!frame || !frame.contentWindow || !frame.contentWindow.document) return;
  const win = frame.contentWindow;
  const before = deckIndex(win);
  if (before === index) {
    room.beat = index;
    markChapter(index);
    return;
  }
  try {
    win.location.hash = "#" + (index + 1);
  } catch (err) {
    return;
  }
  if (deckIndex(win) !== index) nudgeDeck(win, before, index);
  room.beat = deckIndex(win);
  markChapter(room.beat);
  if (room.beat !== index) {
    setTimeout(() => {
      if (deckIndex(win) !== index) nudgeDeck(win, deckIndex(win), index);
      room.beat = deckIndex(win);
      markChapter(room.beat);
    }, 70);
  }
}

function nudgeDeck(win, from, to) {
  const key = to > from ? "ArrowRight" : "ArrowLeft";
  const steps = Math.abs(to - from);
  for (let step = 0; step < steps; step += 1) {
    win.document.dispatchEvent(new KeyboardEvent("keydown", { key: key, bubbles: true }));
  }
}

function deckIndex(win) {
  try {
    const slides = [...win.document.querySelectorAll(".slide")];
    const scroller = win.document.querySelector(".deck");
    if (!scroller || !slides.length) return 0;
    const top = scroller.scrollTop;
    let best = 0;
    let bestDist = Infinity;
    slides.forEach((slide, index) => {
      const dist = Math.abs(slide.offsetTop - top);
      if (dist < bestDist) {
        best = index;
        bestDist = dist;
      }
    });
    return best;
  } catch (err) {
    return room.beat || 0;
  }
}

function markChapter(index) {
  document.querySelectorAll(".chapter").forEach((node, item) => {
    const on = item === index;
    node.classList.toggle("on", on);
    node.setAttribute("aria-current", on ? "true" : "false");
  });
}

function onFilmTime(video) {
  const ms = video.currentTime * 1000;
  const items = chapterItems(room.edl);
  const index = indexAt(items, ms);
  room.beat = index;
  markChapter(index);
  const fill = document.getElementById("fill");
  if (fill) fill.style.width = (video.duration ? (video.currentTime / video.duration) * 100 : 0) + "%";
  const time = document.getElementById("time");
  if (time) time.textContent = clock(ms) + " / " + clock((video.duration || 0) * 1000);
  const bar = document.getElementById("track");
  if (bar && video.duration) {
    bar.setAttribute("aria-valuenow", String(Math.round((video.currentTime / video.duration) * 100)));
    bar.setAttribute("aria-valuetext", clock(ms));
  }
  const caption = document.getElementById("caption");
  if (!caption) return;
  const text = captionAt(room.edl, ms);
  caption.textContent = text;
  caption.hidden = !text;
}

function togglePlay() {
  const video = document.getElementById("film");
  if (!video) return;
  if (video.paused) video.play();
  else video.pause();
}

function setPlayLabel(playing) {
  const button = document.getElementById("play");
  if (button) button.textContent = playing ? "Pause" : "Play";
}

function seekTrack(event) {
  const video = document.getElementById("film");
  const bar = document.getElementById("track");
  if (!video || !video.duration || !bar) return;
  const rect = bar.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
  video.currentTime = ratio * video.duration;
}

function onTrackKey(event) {
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  event.preventDefault();
  event.stopPropagation();
  const video = document.getElementById("film");
  if (!video || !video.duration) return;
  const delta = event.key === "ArrowRight" ? 2 : -2;
  video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + delta));
}

function onKey(event) {
  const target = event.target;
  if (!target || typeof target.closest !== "function") return;
  if (target.closest("input, textarea")) return;
  if (target.closest("[role='slider']")) return;
  if (room.mode !== "film" && room.mode !== "deck" && room.mode !== "read") return;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    event.preventDefault();
    goBeat(room.beat + 1);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    event.preventDefault();
    goBeat(room.beat - 1);
  } else if (event.key === " " && room.mode === "film" && !event.target.closest("button, a")) {
    event.preventDefault();
    togglePlay();
  }
}

async function onAsk(event) {
  event.preventDefault();
  if (!room.current) return;
  const question = document.getElementById("q").value.trim();
  if (!question) return;
  const answer = document.getElementById("answer");
  const cite = document.getElementById("cite");
  answer.classList.remove("refused", "bad");
  answer.textContent = "";
  cite.textContent = "";
  try {
    const data = await postJson("/api/v1/briefings/" + room.current.briefing.id + "/chat", { question });
    answer.textContent = data.text || "";
    if (data.refused) answer.classList.add("refused");
    else cite.textContent = citeLabel(data.citations);
    if (!data.refused && data.ord) {
      if (room.mode === "film") seekFilmBeat(data);
      else goBeat(Number(data.ord) - 1);
    }
  } catch (err) {
    answer.textContent = "The room could not answer.";
    answer.classList.add("bad");
  }
}

function seekFilmBeat(data) {
  const video = document.getElementById("film");
  if (!video) return;
  const beats = (room.current.script && room.current.script.beats) || [];
  const beat = beats.find((item) => item.ord === data.ord) || beats[Number(data.ord) - 1];
  const cite = ((data.citations || [])[0]) || (beat && (beat.citations || [])[0]);
  if (cite && cite.kind === "recording" && cite.t_start_ms != null) {
    video.currentTime = Number(cite.t_start_ms) / 1000;
    return;
  }
  const text = beat && String(beat.text || "").toLowerCase();
  const cut = ((room.edl && room.edl.items) || []).find((item) => String(item.text || "").toLowerCase() === text);
  if (cut) video.currentTime = Number(cut.out_in_ms || 0) / 1000;
}

async function accept() {
  if (!room.current || !room.current.script) return;
  await postJson("/api/v1/briefings/" + room.current.briefing.id + "/script/accept", {});
  room.current.script.accepted = true;
  renderTools();
}

async function project() {
  if (!room.current || room.busy) return;
  const briefing = room.current.briefing;
  room.busy = true;
  renderTools();
  try {
    showWorking(briefing.skill_id, briefing.title, "Projecting the briefing.");
    await runJob(briefing.id, "render");
    room.busy = false;
    await openBriefing(briefing.id);
  } catch (err) {
    room.busy = false;
    showFailure(briefing.title, err.message || "The job failed.");
    renderTools();
  }
}

async function begin(file) {
  if (room.busy) return;
  if (/\.xlsx?$/i.test(file.name)) {
    showSheet({
      eyebrow: "Workbook",
      title: "This file is a spreadsheet.",
      lead: "A workbook has to be the JSON pack.",
      bad: true,
    });
    hideScrub();
    return;
  }
  const plan = planFor(file);
  const title = titleFrom(file.name);
  room.skill = plan.skill;
  room.busy = true;
  room.current = null;
  renderTools();
  try {
    showWorking(plan.skill, title, "Taking the file in.");
    const created = await postJson("/api/v1/briefings", { title, skill_id: plan.skill });
    room.openingId = created.id;
    history.replaceState(null, "", "#/" + created.id);
    await loadIndex();
    await postFile("/api/v1/briefings/" + created.id + "/assets", plan.kind, file);
    if (plan.kind === "recording") {
      showWorking(plan.skill, title, "Listening to the recording.");
      await runJob(created.id, "transcribe");
    }
    showWorking(plan.skill, title, "Writing the script.");
    await runJob(created.id, "compile");
    showWorking(plan.skill, title, "Projecting the briefing.");
    await runJob(created.id, "render");
    room.busy = false;
    await openBriefing(created.id);
  } catch (err) {
    room.busy = false;
    showFailure(title, err.message || "The job failed.");
    renderTools();
    loadIndex();
  }
}

async function runJob(id, type) {
  const job = await postJson("/api/v1/briefings/" + id + "/jobs", { type });
  for (let attempt = 0; attempt < 90; attempt += 1) {
    const row = await getJson("/api/v1/jobs/" + job.id);
    if (row.state === "succeeded") return row;
    if (row.state === "failed" || row.state === "cancelled") {
      throw new Error(row.error || "The job failed.");
    }
    await sleep(2000);
  }
  throw new Error("Still working. It is taking longer than expected.");
}

function planFor(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".docx")) {
    const skill = room.skill === "launch-announcement" ? "launch-announcement" : "leadership-brief";
    return { skill, kind: "document" };
  }
  if (name.endsWith(".json")) {
    const workbook = new Set(["weekly-ops-review", "wbr-executive", "wbr-kpi-spine", "kpi-spotlight-deck"]);
    return { skill: workbook.has(room.skill) ? room.skill : "weekly-ops-review", kind: "workbook" };
  }
  const recording = new Set(["product-walkthrough", "sop-training", "feature-delta", "continuous-take-demo", "still-sequence-slideshow", "chaptered-demo-cut"]);
  return { skill: recording.has(room.skill) ? room.skill : "product-walkthrough", kind: "recording" };
}

function showIntake() {
  room.mode = "intake";
  document.title = "Grounded";
  const stage = document.getElementById("stage");
  stage.className = "sheet";
  const skills = CHOICES.map(([id, word]) => {
    const on = room.skill === id;
    return `<button type="button" data-skill="${id}" aria-pressed="${on ? "true" : "false"}">${word}</button>`;
  }).join("");
  stage.innerHTML = `<article class="frame cover" id="drop"><p class="eyebrow">New briefing</p><h1>What should the room watch?</h1><p class="lead">Drop a recording, a workbook, or a Word file.</p><div class="skills" role="group" aria-label="Kind of briefing">${skills}</div><p class="hint"><span>${esc(skillHint(room.skill))}</span> <button type="button" id="browse">Choose a file</button></p></article>`;
  stage.querySelectorAll("[data-skill]").forEach((node) => {
    node.addEventListener("click", () => {
      room.skill = node.dataset.skill;
      showIntake();
    });
  });
  document.getElementById("browse").addEventListener("click", () => document.getElementById("file").click());
  hideWatch();
  renderTools();
  renderRail();
}

function showWorking(skill, title, sentence) {
  showSheet({ eyebrow: skillWord(skill), title: sentence, lead: title });
  hideScrub();
  document.getElementById("ask").hidden = true;
  say(sentence);
}

function showFailure(title, message) {
  const text = String(message || "Something in the job failed.");
  const brief = text.length < 240 && text.indexOf("Traceback") === -1 && text.indexOf("\n") === -1;
  const stage = document.getElementById("stage");
  stage.className = "sheet";
  const body = brief ? `<p class="lead bad">${esc(text)}</p>` : `<pre class="trace">${esc(text)}</pre>`;
  stage.innerHTML = `<article class="frame cover"><p class="eyebrow risk">Could not finish</p><h1>This one did not finish.</h1>${body}</article>`;
  hideScrub();
  say("This one did not finish.");
}

function showSheet({ eyebrow, title, lead, bad }) {
  const stage = document.getElementById("stage");
  stage.className = "sheet";
  const line = lead ? `<p class="lead${bad ? " bad" : ""}">${esc(lead)}</p>` : "";
  stage.innerHTML = `<article class="frame cover"><p class="eyebrow${bad ? " risk" : ""}">${esc(eyebrow || "")}</p><h1>${esc(title || "")}</h1>${line}</article>`;
}

function hideWatch() {
  hideScrub();
  document.getElementById("ask").hidden = true;
  clearAnswer();
}

function hideScrub() {
  const scrub = document.getElementById("scrub");
  scrub.hidden = true;
  scrub.innerHTML = "";
}

function clearAnswer() {
  const answer = document.getElementById("answer");
  const cite = document.getElementById("cite");
  const input = document.getElementById("q");
  answer.textContent = "";
  answer.classList.remove("refused", "bad");
  cite.textContent = "";
  if (input) input.value = "";
}

function currentBeats() {
  if (room.mode === "film") return chapterItems(room.edl);
  const script = room.current && room.current.script;
  return (script && script.beats) || [];
}

function chapterItems(edl) {
  const items = (edl && edl.items) || [];
  const carries = items.filter((item) => item.type === "carry");
  if (carries.length) return carries;
  const chapters = items.filter((item) => item.type === "chapter");
  return chapters.length ? chapters : items.filter((item) => item.type === "cut");
}

function indexAt(items, ms) {
  let current = 0;
  items.forEach((item, index) => {
    if (Number(item.out_in_ms || 0) <= ms) current = index;
  });
  return current;
}

function captionAt(edl, ms) {
  const cuts = ((edl && edl.items) || []).filter((item) => item.type === "cut");
  let text = "";
  cuts.forEach((cut) => {
    const start = Number(cut.out_in_ms || 0);
    const end = start + Number(cut.duration_ms || 0);
    if (ms >= start && ms < end && cut.text) text = cut.text;
  });
  return text;
}

function citeLabel(citations) {
  return (citations || []).map((cite) => {
    if (!cite) return "";
    if (cite.kind === "workbook") return (cite.sheet || "") + "!" + (cite.addr || "");
    if (cite.kind === "document") return "block " + (cite.block_id || "");
    if (cite.kind === "recording") return clock(cite.t_start_ms) + "–" + clock(cite.t_end_ms);
    return "";
  }).filter(Boolean).join(" · ");
}

function unwrap(row) {
  if (!row) return null;
  let raw = row.raw_json;
  if (typeof raw === "string") raw = JSON.parse(raw);
  if (!raw || typeof raw !== "object") return null;
  raw.accepted = Boolean(row.accepted);
  return raw;
}

function skillWord(skill) { return SKILL_WORD[skill] || "Briefing"; }

function skillHint(skill) {
  if (skill === "weekly-ops-review" || skill === "wbr-executive" || skill === "wbr-kpi-spine") return "A workbook as JSON. Empty KPIs fail.";
  if (skill === "leadership-brief" || skill === "launch-announcement") return "A Word file.";
  if (skill === "continuous-take-demo") return "A screen recording. Each beat keeps a frame from the last.";
  if (skill === "still-sequence-slideshow") return "A screen recording, advanced as cited stills.";
  return "A screen recording.";
}

function titleFrom(name) {
  const base = String(name || "").replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
  if (!base) return "Untitled briefing";
  return base.charAt(0).toUpperCase() + base.slice(1);
}

function short(text) {
  const clean = String(text || "").replace(/\s+/g, " ").trim();
  if (clean.length <= 32) return clean;
  return clean.slice(0, 30).trim() + "…";
}

function stamp(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return date.getDate() + " " + months[date.getMonth()];
}

function clock(ms) {
  const total = Math.max(0, Math.floor(Number(ms || 0) / 1000));
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}

function say(text) { document.getElementById("live").textContent = text || ""; }

function currentTitle() {
  return (room.current && room.current.briefing && room.current.briefing.title) || "Briefing";
}

function fileUrl(id) { return "/api/v1/artifacts/" + encodeURIComponent(id) + "/file"; }

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

async function getJson(url) {
  const response = await fetch(url);
  if (!response.ok) {
    const err = new Error(response.status === 404 ? "Not found" : "The room could not reach the studio.");
    err.status = response.status;
    throw err;
  }
  return response.json();
}

async function postJson(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!response.ok) {
    let detail = "";
    try {
      const payload = await response.json();
      detail = payload.detail || "";
    } catch (err) {
      detail = "";
    }
    const message = typeof detail === "string" && detail ? detail : "The room could not reach the studio.";
    const err = new Error(message);
    err.status = response.status;
    throw err;
  }
  if (response.status === 204) return {};
  return response.json();
}

async function postFile(url, kind, file) {
  const body = new FormData();
  body.append("kind", kind);
  body.append("file", file);
  const response = await fetch(url, { method: "POST", body });
  if (!response.ok) {
    let detail = "";
    try {
      const payload = await response.json();
      detail = payload.detail || "";
    } catch (err) {
      detail = "";
    }
    throw new Error(typeof detail === "string" && detail ? detail : "The file did not land.");
  }
  return response.json();
}

function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
