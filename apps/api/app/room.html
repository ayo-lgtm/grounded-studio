function showWorking(skill, title, steps, filename) {
  const stage = stageEl();
  stage.innerHTML = `<section class="work glass" id="work"><span class="chip">${esc(skillWord(skill))}</span><h2>${esc(title || "Briefing")}</h2><div class="file">${esc(filename || "")}</div><ol class="steps" id="steps"></ol><div class="meter"><i id="meter"></i></div><p class="note"><svg width="13" height="13"><use href="#i-shield"/></svg>Processed on private infrastructure. Nothing ships without a citation.</p></section>`;
  paintSteps(steps);
  hideScrub();
}

function paintSteps(steps) {
  const list = byId("steps");
  if (!list) return;
  list.innerHTML = steps.map((step) => {
    const state = step.state || "pending";
    const icon = state === "done" ? '<svg width="13" height="13"><use href="#i-check"/></svg>' : state === "failed" ? '<svg width="12" height="12"><use href="#i-x"/></svg>' : "";
    const elapsed = step.started ? clock(((step.ended || Date.now()) - step.started)) : "";
    return `<li class="${state}"><span class="mark">${icon}</span><div><b>${esc(step.label)}</b><small>${esc(step.hint || "")}</small></div><span class="t">${esc(elapsed)}</span></li>`;
  }).join("");
  const done = steps.filter((step) => step.state === "done").length;
  const active = steps.some((step) => step.state === "active") ? 0.5 : 0;
  const meter = byId("meter");
  if (meter) meter.style.width = Math.round(((done + active) / steps.length) * 100) + "%";
  const current = steps.find((step) => step.state === "active");
  if (current) say(current.label);
}

function showFailure(title, message, plan) {
  const text = String(message || "Something in the job failed.");
  const stage = stageEl();
  const parts = text.split(/;\s+/).filter(Boolean);
  const listed = parts.length > 1 && parts.length <= 12;
  const body = listed ? `<pre class="trace">${esc(parts.join("\n"))}</pre>` : `<pre class="trace">${esc(text)}</pre>`;
  stage.innerHTML = `<section class="work glass failed"><span class="chip rose">Could not finish</span><h2>This one did not finish.</h2><div class="file">${esc(title || "")}</div>${body}<p class="note"><svg width="13" height="13"><use href="#i-shield"/></svg>Grounded Studio stops rather than ship a claim it can't trace.</p><div class="row"><button type="button" class="btn primary" id="again">New briefing</button>${room.current ? "" : ""}</div></section>`;
  byId("again").addEventListener("click", goNew);
  hideScrub();
  say("This one did not finish.");
  void plan;
}

function showMessage({ eyebrow, title, lead, bad }) {
  const stage = stageEl();
  stage.innerHTML = `<section class="work glass${bad ? " failed" : ""}"><span class="chip${bad ? " rose" : ""}">${esc(eyebrow || "")}</span><h2>${esc(title || "")}</h2>${lead ? `<div class="file">${esc(lead)}</div>` : ""}<div class="row"><button type="button" class="btn" id="again">New briefing</button></div></section>`;
  byId("again").addEventListener("click", goNew);
}

function hideScrub() {
  const scrub = byId("scrub");
  scrub.hidden = true;
  scrub.innerHTML = "";
}

/* ---------------- helpers ---------------- */
function currentBeats() {
  if (room.mode === "film") return chapterItems(room.edl);
  const script = room.current && room.current.script;
  return (script && script.beats) || [];
}

function chapterItems(edl) {
  const items = (edl && edl.items) || [];
  const carries = items.filter((item) => item.type === "carry");
  if (carries.length) return carries;
  const chapters = items.filter((item) => item.type === "chapter");
  return chapters.length ? chapters : items.filter((item) => item.type === "cut");
}

function indexAt(items, ms) {
  let current = 0;
  items.forEach((item, index) => { if (Number(item.out_in_ms || 0) <= ms) current = index; });
  return current;
}

function captionAt(edl, ms) {
  let text = "";
  ((edl && edl.items) || []).filter((item) => item.type === "cut").forEach((cut) => {
    const start = Number(cut.out_in_ms || 0);
    if (ms >= start && ms < start + Number(cut.duration_ms || 0) && cut.text) text = cut.text;
  });
  return text;
}

function citeOne(cite) {
  if (!cite) return "";
  if (cite.kind === "workbook") return (cite.sheet || "") + "!" + (cite.range || cite.addr || "");
  if (cite.kind === "document") return "block " + (cite.block_id || "") + (cite.page ? " · p." + cite.page : "");
  if (cite.kind === "recording") return clock(cite.t_start_ms) + "–" + clock(cite.t_end_ms);
  return "";
}

function citeLabel(citations) {
  return (citations || []).map(citeOne).filter(Boolean).join(" · ");
}

function formatClaim(claim) {
  const value = Number(claim.value);
  if (!Number.isFinite(value)) return String(claim.value);
  const unit = claim.unit;
  if (unit === "pct") return value.toLocaleString(undefined, { maximumFractionDigits: 1 }) + "%";
  if (unit === "usd" || unit === "currency") return "$" + value.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function unwrap(row) {
  if (!row) return null;
  let raw = row.raw_json;
  if (typeof raw === "string") raw = JSON.parse(raw);
  if (!raw || typeof raw !== "object") return null;
  raw.accepted = Boolean(row.accepted);
  return raw;
}

function skillWord(skill) { return SKILL_WORD[skill] || "Briefing"; }

function skillHint(skill) {
  if (skill === "executive-business-review") return "A workbook, documents, a deck, or a .zip of them. Every number cites its cell.";
  if (WORKBOOK_SKILLS.has(skill)) return "An Excel or CSV workbook (or a .zip with its memo). Every number cites its cell.";
  if (skill === "leadership-brief" || skill === "launch-announcement") return "A Word, PDF, PowerPoint, Markdown file or screenshot.";
  if (skill === "continuous-take-demo") return "A screen recording. Each beat keeps a frame from the last.";
  if (skill === "still-sequence-slideshow") return "A screen recording, advanced as cited stills.";
  return "A screen recording. Filler and dead air are cut; every line keeps its timestamp.";
}

function titleFrom(name) {
  const base = String(name || "").replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim();
  if (!base) return "Untitled briefing";
  return base.charAt(0).toUpperCase() + base.slice(1);
}

function short(text) {
  const clean = String(text || "").replace(/\s+/g, " ").trim();
  return clean.length <= 34 ? clean : clean.slice(0, 32).trim() + "…";
}

function stamp(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return date.getDate() + " " + months[date.getMonth()];
}

function clock(ms) {
  const total = Math.max(0, Math.floor(Number(ms || 0) / 1000));
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}

function toast(text) {
  const node = byId("toast");
  node.textContent = text;
  node.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => node.classList.remove("on"), 2200);
  say(text);
}

function say(text) { byId("live").textContent = text || ""; }
function byId(id) { return document.getElementById(id); }
function currentTitle() { return (room.current && room.current.briefing && room.current.briefing.title) || "Briefing"; }
function fileUrl(id) { return "/api/v1/artifacts/" + encodeURIComponent(id) + "/file"; }

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

async function getJson(url) {
  const response = await fetch(url, { credentials: "same-origin" });
  if (!response.ok) {
    const err = new Error(response.status === 404 ? "Not found" : "The studio could not be reached.");
    err.status = response.status;
    throw err;
  }
  return response.json();
}

async function postJson(url, body) {
  const response = await fetch(url, { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!response.ok) throw await failure(response, "The studio could not be reached.");
  if (response.status === 204) return {};
  return response.json();
}

async function postFile(url, kind, file) {
  const body = new FormData();
  body.append("kind", kind);
  body.append("file", file);
  const response = await fetch(url, { method: "POST", credentials: "same-origin", body });
  if (!response.ok) throw await failure(response, "The file did not land.");
  return response.json();
}

async function failure(response, fallback) {
  let detail = "";
  try { detail = (await response.json()).detail || ""; } catch (err) { detail = ""; }
  const err = new Error(typeof detail === "string" && detail ? detail : fallback);
  err.status = response.status;
  return err;
}

function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

boot();
</script>
