name: private-runtime-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  private-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r apps/api/requirements.txt -r apps/worker/requirements.txt
      - name: Reject cloud egress code paths
        run: |
          set -e
          ! grep -R -nE 'bedrock-runtime|start_transcription_job|synthesize_speech|TranscriptFileUri|amazonaws\.com' apps/api apps/engine apps/worker
      - name: Run engine tests
        env:
          PYTHONPATH: apps/engine
          GROUNDED_SKILLS_ROOT: skills
        run: python -m unittest discover -s apps/engine/tests -p "test_*.py" -v
      - name: Run worker tests
        env:
          PYTHONPATH: apps/worker:apps/engine
          GROUNDED_SKILLS_ROOT: skills
        run: python -m unittest discover -s apps/worker/tests -p "test_*.py" -v
      - name: Run API tests
        env:
          PYTHONPATH: apps/api:apps/engine
          GROUNDED_SKILLS_ROOT: skills
          DEV_BYPASS_AUTH: "true"
        run: python -m unittest discover -s apps/api/tests -p "test_*.py" -v
