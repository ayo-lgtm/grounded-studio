# Build the repo-root offline bake and push a private GHCR image.
# Railway's GitHub app cannot clone this private repo; api and worker
# pull ghcr.io/ayo-lgtm/grounded-studio:offline (or :main) instead.
# See docs/16-railway.md.

name: Publish offline image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "apps/**"
      - "infra/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-offline-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push offline bake
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/ayo-lgtm/grounded-studio:offline
            ghcr.io/ayo-lgtm/grounded-studio:main
          labels: |
            org.opencontainers.image.source=https://github.com/ayo-lgtm/grounded-studio
            org.opencontainers.image.description=Grounded Studio offline bake (api, worker, local weights)
