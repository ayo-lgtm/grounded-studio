# Pilot deploy on a locked-down internal box.
# No public model endpoints. Point MODEL_BASE_URL at local vLLM/Ollama.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grounded
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: grounded
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # api / web / worker images are added when application code lands.

volumes:
  pgdata:
  miniodata:
