# Pilot deploy on an internal AWS box (single EC2).
# AI runs on Bedrock Claude in-region; transcription on AWS Transcribe.
# The instance profile supplies credentials — never put AWS keys in .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grounded}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-grounded}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grounded"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-grounded}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-too}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grounded}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-grounded}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-grounded}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-too}
      MINIO_BUCKET: ${MINIO_BUCKET:-grounded}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CLAUDE_MODEL_ID: ${CLAUDE_MODEL_ID:-anthropic.claude-3-5-sonnet-20241022-v2:0}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grounded}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-grounded}
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CLAUDE_MODEL_ID: ${CLAUDE_MODEL_ID:-anthropic.claude-3-5-sonnet-20241022-v2:0}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-grounded}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-grounded}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-too}
      TRANS_PROVIDER: ${TRANS_PROVIDER:-stub}
      TRANS_S3_BUCKET: ${TRANS_S3_BUCKET:-}
      TRANS_LANGUAGE: ${TRANS_LANGUAGE:-en-US}
      NARRATION_PROVIDER: ${NARRATION_PROVIDER:-}
      NARRATION_VOICE: ${NARRATION_VOICE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  miniodata:
